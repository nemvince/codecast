services:
  app:
    build: .
    container_name: codecast-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      piston:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql://codecast:codecast@postgres:5432/codecast
      PISTON_URL: http://piston:2000
    ports:
      - '127.0.0.1:3000:3000'

  # One-shot: applies drizzle/ to the database and exits. Run it before the app starts —
  # `docker compose run --rm migrate` — or make the app service depend on it with
  # `migrate: { condition: service_completed_successfully }`.
  migrate:
    build:
      context: .
      target: migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://codecast:codecast@postgres:5432/codecast
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  piston:
    image: ghcr.io/engineer-man/piston@sha256:2f66b7456189c4d713aa986d98eccd0b6ee16d26c7ec5f21b30e942756fd127a
    container_name: codecast-piston
    restart: unless-stopped
    privileged: true
    ports:
      - '127.0.0.1:2000:2000'
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec
    environment:
      PISTON_OUTPUT_MAX_SIZE: '65536'
      PISTON_RUN_TIMEOUT: '5000'
      PISTON_RUN_CPU_TIME: '5000'
      PISTON_COMPILE_TIMEOUT: '10000'
      PISTON_COMPILE_CPU_TIME: '10000'
      PISTON_MAX_CONCURRENT_JOBS: '8'

  postgres:
    image: postgres:18-alpine
    container_name: codecast-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: codecast
      POSTGRES_PASSWORD: codecast
      POSTGRES_DB: codecast
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codecast -d codecast']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  piston-packages:
  postgres-data:
